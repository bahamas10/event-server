[package]
name = "event-server"
version = "0.1.0"
edition = "2024"
default-run = "event-server"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures-util = "0.3.32"
gethostname = "1.1.0"
log = "0.4.31"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
reqwest-sse = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.45", features = ["serde-human-readable"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
toml = "1.1.2"
uuid = { version = "1.23.1", features = ["v7", "serde"] }
